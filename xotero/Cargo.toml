[package]
name = "xotero"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
async-compression = { version = "0.4", features = ["tokio", "gzip"] }
flate2 = "1"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
# Derive restart-stable login handoff keys from a dedicated server credential.
hmac = "0.12"
# Verify uploaded attachment bytes against the client-declared md5.
md-5 = "0.10"
quick-xml = "=0.41.0"
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "postgres",
  "json",
  "migrate",
  "macros",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs"] }
# preserve_order keeps object key order under our control: Zotero's attachment
# fromJSON processes fields in order and needs linkMode before filename/path.
serde_json = { version = "1", features = ["preserve_order"] }
serde = { version = "=1.0.229", features = ["derive"] }
# Hash presented API tokens before database lookup; plaintext keys never persist.
sha2 = "0.10"
# Parse multi-valued query strings: the CLI `tag` filter repeats the key for AND.
serde_urlencoded = "0.7"
# S3-compatible object storage for attachment bytes (Cloudflare R2 in
# production, RustFS in the integration test). rustls to avoid an OpenSSL build.
rust-s3 = { version = "=0.38.0", default-features = false, features = [
  "tokio-rustls-tls-ring",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
